kind = "web"
previewPath = "/"
title = "EduPanel"
version = "1.0.0"
id = "artifacts/edupanel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20672

[services.development]
run = "pnpm --filter @workspace/edupanel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edupanel", "run", "build" ]
publicDir = "artifacts/edupanel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20672"
BASE_PATH = "/"
