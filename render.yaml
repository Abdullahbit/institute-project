services:
  - type: web
    name: institute-api
    env: node
    plan: free
    # Run from the root to preserve the pnpm monorepo context
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @institute/api build
    startCommand: cd apps/api && npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: PNPM_VERSION
        value: "9"
      # You will add these securely in the Render dashboard:
      # - SUPABASE_URL
      # - SUPABASE_SERVICE_KEY
      # - INNGEST_EVENT_KEY
      # - INNGEST_SIGNING_KEY
